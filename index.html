<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scritt - Account Deletion</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #005D14; margin-bottom: 1rem; }
        p { color: #4b5563; line-height: 1.5; margin-bottom: 2rem; }
        .btn { 
            display: inline-block; background-color: #EFA33E; color: white; padding: 15px 30px; 
            text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Scritt</h1>
        <p>To permanently delete your Scritt account and all associated data, please click the button below to open the app.</p>
        
        <a href="com.adesegunadetutu.scritt://profile/delete-account" class="btn">
            Open Scritt to Delete Account
        </a>
    </div>
</body>
</html>
